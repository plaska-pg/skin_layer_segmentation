# Base hyperparameters for the predict.py -> postprocess.py -> measurement.py
# pipeline. Edit values here instead of hunting through each script; every
# run's <out>/run_config.yaml records what was actually used, including any
# --arg overrides passed on the predict.py command line.

predict:
  weights: models/3cls_best_v8_e.pt
  source: inference_images
  device: auto
  um_per_px: 0.2577          # native um/px of --source images (0 disables rescaling) (10x) (0.2577um/px = 40x)
  reference_um_per_px: 0.645  # um/px the model was trained at (10x); = datasets/seg_finetune/scale_calibration.json reference
  tile: 1024               # sliding-window tile (px at reference_um_per_px); lower if CUDA OOM
  tta: none                # test-time augmentation per tile: none | flip (4x slower) | d4 (8x slower)
  workers: 1

postprocess:
  # um, not raw px: native pixel size varies with scan resolution (e.g. 0.26 vs
  # 0.645 um/px), so a fixed px count means a different physical distance on
  # different scans.
  sc_erod_dil_kernel_size_um: 5          # elliptical kernel diameter for SC opening then closing (0 disables)
  epidermal_erod_dil_kernel_size_um: 12  # same for Epidermis
  gland_erod_dil_kernel_size_um: 10      # same for gland (0 disables)
  sc_epidermis_contact_enabled: true     # drop SC/Epidermis connected components that don't touch the other class (after morphology)
  sc_epidermis_contact_gap_um: 5         # mostly to get rid of SC components not touching Epidermis (the ones separated from the main tissue)
  lateral_clip_frac: 0.05     # fraction of the SC+Epidermis band's arc length (along its spine) trimmed off each end
  rotation_weights: models/rotate_model.pt   # trained orientation classifier (training/rotation/rotate.py)
  rotation_device: auto
  follicle_enabled: true                     # YOLO-OBB follicle detector on the rotated image (steps panel + follicle masking)
  follicle_weights: models/follicle_det_v4.pt   # training/detection/train_det.py --target follicle
  follicle_device: auto
  follicle_conf: 0.3 # confidence threshold for follicle detection
  follicle_padding_um: 50    # expand each side of the oriented follicle box by this many um before masking (0 disables)
  follicle_mask_frac: 1.0   #bottom fraction of each follicle box (cut parallel to its top edge) are removed from SC and Epidermis before measurement (0 disables)
  follicle_max_side: 1024   # whole-slide weights only: long side the image is downscaled to before detection; must match training
  follicle_imgsz: 1024      # whole-slide weights only (tiled weights carry their own um/px + tile size)
  roi_enabled: true                     # YOLO-OBB ROI detector; SC/Epidermis outside the union of its boxes is removed (full frame if none detected)
  roi_weights: models/roi_det_v3.pt
  roi_device: auto
  roi_conf: 0.3
  roi_max_side: 1024   # must match training (datasets/roi_follicle/yolo_det/data.yaml max_side)
  roi_imgsz: 1024      # = training/detection/roi.yaml train.imgsz
  quality_enabled: true     # score ROI sections (1 worst - 3 best) with the training/quality/train_qual.py model; CSV 'quality' = mean section score
  quality_weights: models/qual_v2.pt
  quality_device: auto
  quality_sections: 5       # even sections per ROI box (= training/qc_pipeline/qc_pipeline.yaml eval.sections)

measurement:
  skeleton_method: zhang   # 'zhang' (skimage's 2D default) or 'lee'
  hole_area_px: 64        # small holes filled before skeletonizing
  sc_surface_gl_margin_frac: 0.5   # excludes SC boundary within this fraction of SC's typical thickness from GL
  sc_surface_gl_margin_min_px: 3   # margin floor, so a paper-thin SC still gets some separation from GL
  sc_surface_gl_margin_max_px: 30  # margin cap, so an unusually thick SC doesn't over-exclude its outer boundary
  edj_cut_margin_px: 3    # EDJ points within this distance of an artificial cut (lateral trim, ROI, follicle mask) are dropped
  edj_smooth_eps_px: 1.0  # approxPolyDP tolerance removing pixel staircase before measuring EDJ length
  tissue_saturation_threshold: 20  # HSV saturation (0-255) above which a pixel counts as tissue for total_tissue_um2 (blank slide ~8)
