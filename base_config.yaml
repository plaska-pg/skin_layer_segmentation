# Base hyperparameters for the predict.py -> postprocess.py -> measurement.py
# pipeline. Edit values here instead of hunting through each script; every
# run's <out>/run_config.yaml records what was actually used, including any
# --arg overrides passed on the predict.py command line.

predict:
  weights: runs/semseg/dataset_3cls_gland_v2/best.pt
  source: inference_images
  device: auto
  um_per_px: 0.2577          # native um/px of --source images (0 disables rescaling) (10x) (0.2577um/px = 40x)
  reference_um_per_px: 0.645  # um/px the model was trained at (10x)
  max_side: 3500           # cap longest edge fed to the model (GPU memory guard); null = no cap
  workers: 1

postprocess:
  # um, not raw px: native pixel size varies with scan resolution (e.g. 0.26 vs
  # 0.645 um/px), so a fixed px count means a different physical distance on
  # different scans.
  close_radii_um: [10, 36.6, 50, 103.2] # merges a segment until min_touch_frac (like 20%) of the segment is touching the other segment.  also extra dilation+erosion radius to bridge Epidermal gaps and smoothing
  touch_margin_um: 10 # sets how close the two regions’ edges must be to count as “touching.”
  min_touch_frac: 0.10
  sc_smooth_radius_um: 2   # opening radius that knocks small jagged noise off the SC boundary
  lateral_clip_frac: 0.05     # fraction of the rotated ROI's horizontal extent trimmed off each side
  bottom_crop_frac: 0.40      # fraction of the rotated image's bottom rows dropped before ROI/measurement
  rotation_weights: models/rotate_model.pt   # trained orientation classifier (see rotate.py)
  rotation_device: auto
  follicle_enabled: true                     # YOLO-OBB follicle detector on the rotated image (steps panel + follicle masking)
  follicle_weights: models/follicle_det.pt   # see pretrained_model/train_follicle_det.py
  follicle_device: auto
  follicle_conf: 0.1 # confidence threshold for follicle detection
  follicle_mask_frac: 0.8   # SC/Epidermis pixels in the bottom fraction of each follicle box (cut parallel to its top edge) are removed before measurement (0 disables)
  follicle_max_side: 1024   # long side the image is downscaled to before detection; must match training
  follicle_imgsz: 1024

measurement:
  skeleton_method: lee   # 'zhang' (skimage's 2D default) or 'lee'
  hole_area_px: 64        # small holes filled before skeletonizing, so the skeleton graph is a tree
  sc_surface_gl_margin_frac: 0.5   # excludes SC boundary within this fraction of SC's typical thickness from GL
  sc_surface_gl_margin_min_px: 3   # margin floor, so a paper-thin SC still gets some separation from GL
  sc_surface_gl_margin_max_px: 30  # margin cap, so an unusually thick SC doesn't over-exclude its outer boundary
  tissue_saturation_threshold: 20  # HSV saturation (0-255) above which a pixel counts as tissue for total_tissue_um2 (blank slide ~8)
